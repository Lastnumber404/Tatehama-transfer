<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OuDiaSecond 乗換案内</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --border: #e1e4e8; --primary: #1a73e8;
    --up: #d32f2f; --down: #1976d2; --text: #222; --muted: #666;
    --transfer: #f57c00;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; line-height: 1.5; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  .container { max-width: 960px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .upload-area { border: 2px dashed #bbb; border-radius: 12px; padding: 32px; text-align: center; background: #fafbfc; cursor: pointer; }
  .upload-area:hover, .upload-area.dragover { border-color: var(--primary); background: #f0f7ff; }
  input[type="file"] { display: none; }
  select, button, input[type="time"] { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: #fff; cursor: pointer; }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .form-row label { font-weight: 600; min-width: 70px; }
  .result-card { border-left: 4px solid var(--primary); padding: 12px; margin-bottom: 12px; background: #fff; border-radius: 8px; border: 1px solid var(--border); cursor: pointer; }
  .result-card:hover { background: #f8f9fa; }
  .result-card.transfer { border-left-color: var(--transfer); }
  .detail-panel { margin-top: 12px; padding: 12px; background: #fafbfc; border-radius: 8px; border: 1px solid var(--border); }
  .timetable { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 8px; }
  .timetable th, .timetable td { border: 1px solid var(--border); padding: 6px 8px; text-align: left; }
  .timetable th { background: #f0f4f8; }
  .leg { margin: 8px 0; padding: 8px; background: #f8f9fa; border-radius: 6px; }
  .leg-header { font-weight: 600; margin-bottom: 4px; }
  .type-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; color: #fff; }
  .time-big { font-size: 1.2rem; font-weight: 700; }
  .arrow { color: var(--muted); margin: 0 6px; }
  .error { color: #d32f2f; padding: 12px; background: #ffebee; border-radius: 8px; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .hidden { display: none !important; }
  .flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pass-time { color: #999; }
  .change-note { font-size: 0.8rem; color: #2e7d32; margin-left: 4px; }
  .save-btn { margin-left: auto; background: #34a853; color: #fff; border-color: #34a853; }
</style>
</head>
<body>
<div class="container">
  <div style="text-align: center; margin-bottom: 16px;">
    <p style="margin: 0 0 8px; font-size: 1.1rem; font-weight: 600; color: var(--text);">公式ホームページはこちら</p>
    <a href="https://acty-soft.com/traincrew/index.html" target="_blank" rel="noopener noreferrer">
      <img src="logo.png" alt="TRAIN CREW START YOUR TRAIN" style="max-width: 100%; height: auto; max-height: 120px; cursor: pointer;">
    </a>
  </div>
  <div class="flex" style="margin-bottom: 12px;">
    <h1 style="margin:0;">館浜電鉄 乗換案内</h1>
  </div>
  <div id="error" class="error hidden"></div>
  <div id="main" class="">
    <div class="card">
      <div class="flex" style="margin-bottom:12px;">
        <label>ダイヤ:</label>
        <select id="diaSelect"></select>
        <span id="rosenName" class="muted"></span>
      </div>
      <div class="form-row">
        <label>出発駅</label>
        <select id="fromSelect"></select>
        <button id="swapBtn" type="button" title="出発駅と到着駅を入れ替え">⇄ 入れ替え</button>
      </div>
      <div class="form-row">
        <label>到着駅</label>
        <select id="toSelect"></select>
      </div>
      <div class="form-row">
        <label>検索条件</label>
        <select id="searchMode">
          <option value="dep">出発時刻で検索</option>
          <option value="arr">到着時刻で検索</option>
        </select>
      </div>
      <div class="form-row">
        <label id="timeLabel">出発時刻以降</label>
        <input type="time" id="searchTime" value="07:00">
        <button id="nowBtn" type="button">現在時刻</button>
        <span class="muted" id="timeHint">指定時刻以降に出発するルートを検索</span>
      </div>
      <div class="form-row">
        <label><input type="checkbox" id="useLimited"> 特急を利用する（有料）</label>
      </div>
      <div class="form-row">
        <button class="primary" id="searchBtn">検索</button>
        <button id="clearBtn">クリア</button>
      </div>
      <div class="form-row">
        <button id="firstBtn">始発</button>
        <button id="lastBtn">終電</button>
      </div>
    </div>
    <div id="results" class="card hidden">
      <h2 style="margin:0 0 12px; font-size:1.2rem;">検索結果</h2>
      <div id="resultsList"></div>
      <div id="detailPanel" class="detail-panel hidden"></div>
    </div>
  </div>
</div>
<footer style="margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; font-size: 0.85rem; color: var(--muted);">
  <p style="margin: 0 0 6px;">このページはファンサイトです。公式のものではありません。</p>
  <p style="margin: 0;">製作者: <a href="https://x.com/LastNumber_404" target="_blank" rel="noopener noreferrer" style="color: var(--primary); text-decoration: none;">LastNumber_404</a></p>
</footer>
<script>
const state = { data: null, currentDia: 0 };
const $ = id => document.getElementById(id);
function showError(msg) { const el = $('error'); el.textContent = msg; el.classList.remove('hidden'); }
function hideError() { $('error').classList.add('hidden'); }

function parseOuDia(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const root = { stations: [], types: [], dias: [] };
  let stack = [{ name: 'root', obj: root }];
  let current = root;
  let currentDia = null;
  let isNobori = false;
  let currentTrain = null;

  for (let raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    if (line.endsWith('.') && !line.includes('=')) {
      const name = line.slice(0, -1);
      if (name === '') {
        if (stack.length > 1) {
          stack.pop();
          current = stack[stack.length - 1].obj;
          if (stack[stack.length - 1].name === 'Dia') currentDia = current;
          isNobori = stack[stack.length - 1].name === 'Nobori';
          if (stack[stack.length - 1].name === 'Ressya') currentTrain = null;
        }
      } else {
        let newObj = {};
        if (name === 'Eki') {
          newObj = { name: '', outerTerminals: [] };
          root.stations.push(newObj);
        } else if (name === 'Ressyasyubetsu') {
          newObj = { name: '', color: '#666', parent: null };
          root.types.push(newObj);
        } else if (name === 'Dia') {
          newObj = { name: '', kudari: [], nobori: [] };
          root.dias.push(newObj);
          currentDia = newObj;
        } else if (name === 'Ressya') {
          newObj = { type: 0, number: '', name: '', times: [], rawEki: '', isNobori, outerTerminal: '' };
          currentTrain = newObj;
          const parentName = stack[stack.length - 1].name;
          if (parentName === 'Kudari' && currentDia) currentDia.kudari.push(newObj);
          else if (parentName === 'Nobori' && currentDia) currentDia.nobori.push(newObj);
        } else if (name === 'Kudari') {
          newObj = currentDia || {};
          isNobori = false;
        } else if (name === 'Nobori') {
          newObj = currentDia || {};
          isNobori = true;
        } else if (name === 'OuterTerminal') {
          newObj = { name: '' };
          const station = stack.find(s => s.name === 'Eki');
          if (station && station.obj.outerTerminals) {
            station.obj.outerTerminals.push(newObj);
          }
        } else {
          newObj = {};
        }
        stack.push({ name, obj: newObj });
        current = newObj;
      }
      continue;
    }

    const eq = line.indexOf('=');
    if (eq === -1) continue;
    const key = line.slice(0, eq);
    const val = line.slice(eq + 1);

    if (key === 'Rosenmei') root.rosenmei = val;
    else if (current) {
      if (key === 'Ekimei') current.name = val;
      else if (key === 'Syubetsumei') current.name = val;
      else if (key === 'ParentSyubetsuIndex') current.parent = parseInt(val, 10);
      else if (key === 'JikokuhyouMojiColor') current.color = parseColor(val);
      else if (key === 'DiaName') current.name = val;
      else if (key === 'Syubetsu') current.type = parseInt(val, 10) || 0;
      else if (key === 'Ressyabangou') current.number = val;
      else if (key === 'Ressyamei') current.name = val;
      else if (key === 'OuterTerminalEkimei' || key === 'GaibuShuchakuEkimei') {
        current.name = val;
        if (currentTrain) currentTrain.outerTerminal = val;
      }
      else if (key === 'EkiJikoku') {
        current.rawEki = val;
        current.times = parseEkiJikoku(val, root.stations.length, current.isNobori);
      }
      else if (key.startsWith('Operation') && currentTrain) {
        const opMatch = key.match(/^Operation(\d+)([BA])/);
        if (opMatch) {
          const opStationIdx = parseInt(opMatch[1], 10);
          const isAfter = opMatch[2] === 'A';
          const stationCount = root.stations.length;
          const realIdx = currentTrain.isNobori ? (stationCount - 1 - opStationIdx) : opStationIdx;
          if (realIdx >= 0 && realIdx < stationCount) {
            if (val.startsWith('4/')) {
              const idxMatch = val.match(/^4\/(\d+)/);
              if (idxMatch) {
                const outerIdx = parseInt(idxMatch[1], 10);
                const station = root.stations[realIdx];
                if (station && station.outerTerminals && station.outerTerminals[outerIdx]) {
                  currentTrain.outerTerminal = station.outerTerminals[outerIdx].name || '';
                }
              }
            } else if (val.startsWith('5/')) {
              const typeMatch = val.match(/\$(\d+)/);
              const connType = typeMatch ? parseInt(typeMatch[1], 10) : 0;
              const timeMatch = val.match(/^5\/([^$]*)/);
              const connTime = timeMatch ? normalizeTime(timeMatch[1]) : '';
              if (isAfter && connType >= 1 && connType <= 3) {
                currentTrain.nextConn = { station: realIdx, type: connType, time: connTime };
              } else if (!isAfter && connType === 0) {
                currentTrain.prevConn = { station: realIdx, time: connTime };
              }
            }
          }
        }
      }
    }
  }
  // 次列車接続のマッチング
  root.dias.forEach(dia => {
    ['kudari', 'nobori'].forEach(dir => {
      const trains = dia[dir] || [];
      const commercial = trains.filter(t => isCommercial(t, root.types));
      commercial.forEach(t => {
        if (t.nextConn && t.nextConn.type >= 1) {
          const connStation = t.nextConn.station;
          const endStop = t.times.find(x => x.station === connStation);
          const endTime = endStop ? (endStop.dep || endStop.arr || '00:00') : '00:00';

          const candidates = commercial.filter(nt => 
            nt !== t && nt.prevConn && nt.prevConn.station === connStation
          );

          let best = null;
          // 同一扱・種別変更・列車情報変更は列車番号の数字部分が一致するもののみ採用
          const baseNum = (t.number || '').replace(/[^0-9]/g, '');
          if (baseNum && t.nextConn.type >= 1 && t.nextConn.type <= 3) {
            best = candidates.find(nt => (nt.number || '').replace(/[^0-9]/g, '') === baseNum);
          }

          if (best) {
            t.nextTrainType = best.type;
            t.changeStation = connStation;
            t.nextTrain = best;
          }
        }
      });
    });
  });

  return root;
}

function parseColor(s) {
  if (!s) return '#666666';
  s = s.trim().replace(/^0x/i, '');
  if (/^[0-9A-Fa-f]{8}$/.test(s)) {
    const bb = s.slice(2, 4);
    const gg = s.slice(4, 6);
    const rr = s.slice(6, 8);
    return '#' + rr + gg + bb;
  }
  if (/^[0-9A-Fa-f]{6}$/.test(s)) {
    const bb = s.slice(0, 2);
    const gg = s.slice(2, 4);
    const rr = s.slice(4, 6);
    return '#' + rr + gg + bb;
  }
  const m = s.match(/(\d+)/g);
  if (m && m.length >= 3) {
    const r = Math.min(255, +m[0]);
    const g = Math.min(255, +m[1]);
    const b = Math.min(255, +m[2]);
    return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('').toUpperCase();
  }
  return '#666666';
}

function parseEkiJikoku(str, stationCount, reverse = false) {
  if (!str) return [];
  const parts = str.split(',');
  const result = [];

  parts.forEach((part, i) => {
    if (!part || i >= stationCount) return;

    let mode = 0;
    let timePart = part;

    const dollar = part.indexOf('$');
    if (dollar !== -1) timePart = part.slice(0, dollar);

    const semi = timePart.indexOf(';');
    if (semi !== -1) {
      const first = parseInt(timePart.slice(0, semi), 10);
      if (!isNaN(first) && first >= 0 && first <= 2) mode = first;
      timePart = timePart.slice(semi + 1);
    } else {
      const m = timePart.match(/^(\d)/);
      if (m) mode = parseInt(m[1], 10);
      timePart = '';
    }

    let arr = '', dep = '';
    if (timePart.includes('/')) {
      const [a, d] = timePart.split('/');
      arr = normalizeTime(a);
      dep = normalizeTime(d);
    } else if (timePart) {
      dep = normalizeTime(timePart);
      arr = dep;
    }

    const stationIdx = reverse ? (stationCount - 1 - i) : i;

    if (arr || dep || mode !== 0) {
      result.push({ station: stationIdx, arr, dep, mode });
    }
  });
  return result;
}

function normalizeTime(t) {
  if (!t) return '';
  t = String(t).replace(/[^0-9]/g, '');
  if (!t) return '';
  if (t.length === 5) t = '0' + t;
  if (t.length === 3) t = '0' + t;
  if (t.length === 4) return t.slice(0, 2) + ':' + t.slice(2);
  if (t.length >= 6) {
    return t.slice(0, 2) + ':' + t.slice(2, 4) + ':' + t.slice(4, 6);
  }
  return t;
}

// 時刻を分に変換
function timeToMinutes(t) {
  if (!t) return -1;
  const parts = t.split(':').map(Number);
  const h = parts[0] || 0;
  const m = parts[1] || 0;
  return h * 60 + m;
}

// 通常の時刻比較（aがbより後なら正）
function compareTime(a, b) {
  const ma = timeToMinutes(a);
  const mb = timeToMinutes(b);
  if (ma < 0 || mb < 0) return 0;
  return ma - mb;
}

// 乗換可能か判定（日付またぎ対応、待ち時間上限あり）
function canConnect(arr, dep, maxWaitMin = 180) {
  const arrMin = timeToMinutes(arr);
  const depMin = timeToMinutes(dep);
  if (arrMin < 0 || depMin < 0) return false;
  let wait = depMin - arrMin;
  if (wait < 0) wait += 24 * 60; // 日付またぎ
  return wait > 0 && wait <= maxWaitMin;
}

// 終電用：早朝（0-4時）を翌日扱いにして比較
function compareTimeLast(a, b) {
  const adjust = t => {
    const m = timeToMinutes(t);
    if (m < 0) return -1;
    return m < 4 * 60 ? m + 24 * 60 : m;
  };
  return adjust(a) - adjust(b);
}

function formatTimeNoSec(t) {
  if (!t) return '–';
  const parts = t.split(':');
  if (parts.length >= 2) return parts[0] + ':' + parts[1];
  return t;
}

function getTypeInfo(typeIdx, types) {
  const t = types[typeIdx];
  if (t && t.name) return { name: t.name, color: t.color || '#666666' };
  return { name: `種別${typeIdx}`, color: '#666666' };
}

function isCommercial(train, types) {
  const name = types[train.type]?.name || '';
  return !name.includes('回送') && !name.includes('試運転');
}

function isLimited(train, types) {
  if (!train || !types) return false;
  const checkType = (typeIdx) => {
    if (typeIdx == null || typeIdx < 0 || typeIdx >= types.length) return false;
    const t = types[typeIdx];
    if (!t) return false;
    const name = t.name || '';
    if (name.includes('特急')) return true;
    if (t.parent != null && t.parent !== typeIdx) {
      return checkType(t.parent);
    }
    return false;
  };
  if (checkType(train.type)) return true;
  const trainName = train.name || '';
  const number = train.number || '';
  return trainName.includes('特急') || number.includes('特急');
}

function isLimitedOrConnected(train, types) {
  if (isLimited(train, types)) return true;
  if (train.nextTrain && isLimited(train.nextTrain, types)) return true;
  return false;
}

function getDestination(train, isDown) {
  const stations = state.data.stations;
  if (train.outerTerminal) return train.outerTerminal;
  const stops = train.times.filter(t => t.arr || t.dep).sort((a,b) => a.station - b.station);
  if (!stops.length) return '–';
  if (isDown) return stations[stops[stops.length - 1].station]?.name || '–';
  return stations[stops[0].station]?.name || '–';
}

function renderMain() {
  const d = state.data;
  $('rosenName').textContent = d.rosenmei ? '（' + d.rosenmei + '）' : '';
  const sel = $('diaSelect');
  sel.innerHTML = '';
  d.dias.forEach((dia, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = dia.name || `ダイヤ${i+1}`;
    sel.appendChild(opt);
  });
  sel.onchange = () => { state.currentDia = parseInt(sel.value); };
  state.currentDia = 0;

  const fromSel = $('fromSelect');
  const toSel = $('toSelect');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';
  d.stations.forEach((st, i) => {
    const opt1 = document.createElement('option');
    opt1.value = i;
    opt1.textContent = st.name || `駅${i+1}`;
    fromSel.appendChild(opt1);
    const opt2 = opt1.cloneNode(true);
    toSel.appendChild(opt2);
  });
  if (d.stations.length > 1) toSel.selectedIndex = d.stations.length - 1;
}

function searchRoutes(fromIdx, toIdx, searchTime, useLimited = false, mode = 'normal', searchType = 'dep') {
  const data = state.data;
  const dia = data.dias[state.currentDia];
  if (!dia) return [];
  const isDown = fromIdx < toIdx;
  if (fromIdx === toIdx) return [];

  const trains = isDown ? dia.kudari : dia.nobori;
  const commercial = trains.filter(t => 
    isCommercial(t, data.types) && (useLimited || !isLimitedOrConnected(t, data.types))
  );

  const results = [];
  const timeLimit = searchTime || '00:00';

  // 直通
  for (const train of commercial) {
    const fromStop = train.times.find(s => s.station === fromIdx);
    const toStop = train.times.find(s => s.station === toIdx);
    if (!fromStop || !toStop) continue;

    const dep = fromStop.dep || fromStop.arr;
    const arr = toStop.arr || toStop.dep;
    if (!dep || !arr) continue;
    // 日付またぎ対応：到着が出発より前なら翌日とみなす
    const depMin = timeToMinutes(dep);
    const arrMin = timeToMinutes(arr);
    if (depMin < 0 || arrMin < 0) continue;
    const actualArrMin = arrMin < depMin ? arrMin + 24 * 60 : arrMin;
    if (actualArrMin <= depMin) continue;

    // 時刻条件
    if (mode === 'normal') {
      if (searchType === 'dep' && compareTime(dep, timeLimit) < 0) continue;
      if (searchType === 'arr' && compareTime(arr, timeLimit) > 0) continue;
    }

    // 区間カバー確認
    const withTime = train.times.filter(x => x.arr || x.dep);
    if (withTime.length) {
      const minIdx = Math.min(...withTime.map(x => x.station));
      const maxIdx = Math.max(...withTime.map(x => x.station));
      if (isDown && (fromIdx < minIdx || toIdx > maxIdx)) continue;
      if (!isDown && (fromIdx > maxIdx || toIdx < minIdx)) continue;
    }

    results.push({
      type: 'direct',
      legs: [{ train, dep, arr, from: fromIdx, to: toIdx }],
      totalDep: dep,
      totalArr: arr
    });
  }

  // 種別変更で継続する列車を直通として追加
  for (const train of commercial) {
    if (!train.nextTrain || train.changeStation == null) continue;
    const next = train.nextTrain;
    if (!isCommercial(next, data.types)) continue;
    if (!useLimited && isLimitedOrConnected(next, data.types)) continue;

    const fromStop = train.times.find(s => s.station === fromIdx);
    const changeStop = train.times.find(s => s.station === train.changeStation);
    const toStop = next.times.find(s => s.station === toIdx);
    if (!fromStop || !changeStop || !toStop) continue;

    const dep = fromStop.dep || fromStop.arr;
    const arr = toStop.arr || toStop.dep;
    if (!dep || !arr) continue;

    // 区間カバー
    const isDown = fromIdx < toIdx;
    if (isDown && (fromIdx > train.changeStation || toIdx < train.changeStation)) continue;
    if (!isDown && (fromIdx < train.changeStation || toIdx > train.changeStation)) continue;

    // 時刻条件
    if (mode === 'normal') {
      if (searchType === 'dep' && compareTime(dep, timeLimit) < 0) continue;
      if (searchType === 'arr' && compareTime(arr, timeLimit) > 0) continue;
    }

    results.push({
      type: 'typeChange',
      legs: [
        { train, dep, arr: changeStop.arr || changeStop.dep, from: fromIdx, to: train.changeStation },
        { train: next, dep: changeStop.dep || changeStop.arr, arr, from: train.changeStation, to: toIdx }
      ],
      totalDep: dep,
      totalArr: arr,
      transferStation: train.changeStation,
      isTypeChange: true
    });
  }

  // 1回乗換
  const intermediates = [];
  if (isDown) {
    for (let z = fromIdx + 1; z < toIdx; z++) intermediates.push(z);
  } else {
    for (let z = fromIdx - 1; z > toIdx; z--) intermediates.push(z);
  }

  for (const z of intermediates) {
    for (const train1 of commercial) {
      const fStop = train1.times.find(s => s.station === fromIdx);
      const zStop1 = train1.times.find(s => s.station === z);
      if (!fStop || !zStop1) continue;
      // 通過駅では乗り換え不可
      if (zStop1.mode === 2) continue;
      const dep1 = fStop.dep || fStop.arr;
      const arr1 = zStop1.arr || zStop1.dep;
      if (!dep1 || !arr1) continue;
      const dep1Min = timeToMinutes(dep1);
      const arr1Min = timeToMinutes(arr1);
      if (dep1Min < 0 || arr1Min < 0) continue;
      if ((arr1Min < dep1Min ? arr1Min + 24 * 60 : arr1Min) <= dep1Min) continue;

      // 区間カバー
      const wt1 = train1.times.filter(x => x.arr || x.dep);
      if (wt1.length) {
        const min1 = Math.min(...wt1.map(x => x.station));
        const max1 = Math.max(...wt1.map(x => x.station));
        if (isDown && (fromIdx < min1 || z > max1)) continue;
        if (!isDown && (fromIdx > max1 || z < min1)) continue;
      }

      for (const train2 of commercial) {
        if (train2 === train1) continue;
        const zStop2 = train2.times.find(s => s.station === z);
        const tStop = train2.times.find(s => s.station === toIdx);
        if (!zStop2 || !tStop) continue;
        // 通過駅では乗り換え不可
        if (zStop2.mode === 2) continue;
        const dep2 = zStop2.dep || zStop2.arr;
        const arr2 = tStop.arr || tStop.dep;
        if (!dep2 || !arr2) continue;
        const dep2Min = timeToMinutes(dep2);
        const arr2Min = timeToMinutes(arr2);
        if (dep2Min < 0 || arr2Min < 0) continue;
        if ((arr2Min < dep2Min ? arr2Min + 24 * 60 : arr2Min) <= dep2Min) continue;
        // 乗換接続：到着より後に出発、かつ待ち時間が妥当な範囲内
        if (!canConnect(arr1, dep2)) continue;

        const wt2 = train2.times.filter(x => x.arr || x.dep);
        if (wt2.length) {
          const min2 = Math.min(...wt2.map(x => x.station));
          const max2 = Math.max(...wt2.map(x => x.station));
          if (isDown && (z < min2 || toIdx > max2)) continue;
          if (!isDown && (z > max2 || toIdx < min2)) continue;
        }

        // 時刻条件（乗換全体）
        if (mode === 'normal') {
          if (searchType === 'dep' && compareTime(dep1, timeLimit) < 0) continue;
          if (searchType === 'arr' && compareTime(arr2, timeLimit) > 0) continue;
        }

        // 種別変更で同一列車が継続する場合は乗換ではなく種別変更として扱う
        const isTypeChange = train1.nextTrain === train2;

        // 1本目の列車がこの駅より先まで行く場合、終点での乗換の方が良いか確認
        const train1Stops = train1.times.filter(x => x.arr || x.dep).sort((a,b) => a.station - b.station);
        const train1Terminal = isDown ? train1Stops[train1Stops.length - 1]?.station : train1Stops[0]?.station;
        let skipThisTransfer = false;
        if (train1Terminal != null && train1Terminal !== z && !isTypeChange) {
          // 終点で乗換可能な列車があるか簡易チェック
          const terminalStop = train1.times.find(s => s.station === train1Terminal);
          if (terminalStop && (terminalStop.arr || terminalStop.dep)) {
            const terminalArr = terminalStop.arr || terminalStop.dep;
            for (const t3 of commercial) {
              if (t3 === train1) continue;
              const t3Stop = t3.times.find(s => s.station === train1Terminal);
              const t3Dest = t3.times.find(s => s.station === toIdx);
              if (!t3Stop || !t3Dest || t3Stop.mode === 2) continue;
              const t3Dep = t3Stop.dep || t3Stop.arr;
              if (t3Dep && canConnect(terminalArr, t3Dep)) {
                skipThisTransfer = true;
                break;
              }
            }
          }
        }
        if (skipThisTransfer) continue;

        results.push({
          type: isTypeChange ? 'typeChange' : 'transfer',
          legs: [
            { train: train1, dep: dep1, arr: arr1, from: fromIdx, to: z },
            { train: train2, dep: dep2, arr: arr2, from: z, to: toIdx }
          ],
          totalDep: dep1,
          totalArr: arr2,
          transferStation: z,
          isTypeChange
        });
      }
    }
  }

  // 2回乗換
  if (intermediates.length >= 2) {
    const limitedInter = intermediates.slice(0, 25);
    for (let i = 0; i < limitedInter.length; i++) {
      for (let j = i + 1; j < limitedInter.length; j++) {
        const z1 = limitedInter[i];
        const z2 = limitedInter[j];
        for (const train1 of commercial) {
          const fStop = train1.times.find(s => s.station === fromIdx);
          const z1Stop = train1.times.find(s => s.station === z1);
          if (!fStop || !z1Stop || z1Stop.mode === 2) continue;
          const dep1 = fStop.dep || fStop.arr;
          const arr1 = z1Stop.arr || z1Stop.dep;
          if (!dep1 || !arr1) continue;
          if (mode === 'normal' && searchType === 'dep' && compareTime(dep1, timeLimit) < 0) continue;

          for (const train2 of commercial) {
            if (train2 === train1) continue;
            const z1Stop2 = train2.times.find(s => s.station === z1);
            const z2Stop2 = train2.times.find(s => s.station === z2);
            if (!z1Stop2 || !z2Stop2 || z1Stop2.mode === 2 || z2Stop2.mode === 2) continue;
            const dep2 = z1Stop2.dep || z1Stop2.arr;
            const arr2 = z2Stop2.arr || z2Stop2.dep;
            if (!dep2 || !arr2) continue;
            if (!canConnect(arr1, dep2)) continue;

            for (const train3 of commercial) {
              if (train3 === train1 || train3 === train2) continue;
              const z2Stop3 = train3.times.find(s => s.station === z2);
              const tStop = train3.times.find(s => s.station === toIdx);
              if (!z2Stop3 || !tStop || z2Stop3.mode === 2) continue;
              const dep3 = z2Stop3.dep || z2Stop3.arr;
              const arr3 = tStop.arr || tStop.dep;
              if (!dep3 || !arr3) continue;
              if (!canConnect(arr2, dep3)) continue;
              if (mode === 'normal' && searchType === 'arr' && compareTime(arr3, timeLimit) > 0) continue;

              results.push({
                type: 'transfer',
                legs: [
                  { train: train1, dep: dep1, arr: arr1, from: fromIdx, to: z1 },
                  { train: train2, dep: dep2, arr: arr2, from: z1, to: z2 },
                  { train: train3, dep: dep3, arr: arr3, from: z2, to: toIdx }
                ],
                totalDep: dep1,
                totalArr: arr3,
                transferStation: z1,
                isTypeChange: false
              });
            }
          }
        }
      }
    }
  }

  // 不要な乗換を除外
  const directs = results.filter(r => r.type === 'direct' || r.type === 'typeChange');
  const filtered = results.filter(r => {
    if (r.type === 'direct') return true;
    // 特急利用時：特急直通が1本でもあれば乗換・種別変更を除外
    if (useLimited) {
      const hasLimitedDirect = directs.some(d => d.type === 'direct' && isLimitedOrConnected(d.legs[0].train, data.types));
      if (hasLimitedDirect && r.type !== 'direct') return false;
    }
    if (r.type === 'typeChange') return true;
    // 同じ出発時刻（±30分）で直通の方が到着が早い場合のみ除外
    for (const d of directs) {
      const depDiff = Math.abs(compareTime(r.totalDep, d.totalDep));
      const arrDiff = compareTime(r.totalArr, d.totalArr);
      if (depDiff <= 30 && arrDiff >= 0) return false;
    }
    return true;
  });

  // ソート
  if (mode === 'depLast' || mode === 'arrLast') {
    // 終電：早朝を翌日扱いして最遅を選ぶ
    if (mode === 'arrLast') {
      filtered.sort((a, b) => compareTimeLast(a.totalArr, b.totalArr) || compareTimeLast(a.totalDep, b.totalDep));
    } else {
      filtered.sort((a, b) => compareTimeLast(a.totalDep, b.totalDep) || compareTimeLast(a.totalArr, b.totalArr));
    }
  } else if (mode === 'normal') {
    // 通常検索：到着時刻の早い順（検索時刻より前の到着は翌日扱い）
    const baseMin = timeToMinutes(timeLimit);
    const adjustArr = t => {
      const m = timeToMinutes(t);
      if (m < 0) return -1;
      return m < baseMin ? m + 24 * 60 : m;
    };
    filtered.sort((a, b) => adjustArr(a.totalArr) - adjustArr(b.totalArr) || compareTime(a.totalDep, b.totalDep));
  } else if (mode.startsWith('arr')) {
    filtered.sort((a, b) => compareTime(a.totalArr, b.totalArr) || compareTime(a.totalDep, b.totalDep));
  } else {
    filtered.sort((a, b) => compareTime(a.totalDep, b.totalDep) || compareTime(a.totalArr, b.totalArr));
  }

  if (mode === 'depFirst' || mode === 'arrFirst') {
    // 始発：直通・種別変更を優先
    const directs = filtered.filter(r => r.type === 'direct' || r.type === 'typeChange');
    const candidates = directs.length ? directs : filtered;
    return candidates.length ? [candidates[0]] : [];
  }
  if (mode === 'depLast' || mode === 'arrLast') {
    // 終電：目的地に到達できる範囲で最も遅い出発を選ぶ
    // 直通・種別変更を優先し、同じ出発時刻なら直通を選ぶ
    if (mode === 'arrLast') {
      filtered.sort((a, b) => compareTimeLast(a.totalArr, b.totalArr) || compareTimeLast(a.totalDep, b.totalDep));
    } else {
      filtered.sort((a, b) => {
        const depCmp = compareTimeLast(a.totalDep, b.totalDep);
        if (depCmp !== 0) return depCmp;
        // 出発が同じなら直通・種別変更を優先
        const aDirect = a.type === 'direct' || a.type === 'typeChange' ? 0 : 1;
        const bDirect = b.type === 'direct' || b.type === 'typeChange' ? 0 : 1;
        return aDirect - bDirect;
      });
    }
    return filtered.length ? [filtered[filtered.length - 1]] : [];
  }

  // 通常検索：同一時刻は最初の1件のみ、合計3件表示
  const unique = [];
  const seenTimes = new Set();
  for (const r of filtered) {
    const key = r.totalDep + '|' + r.totalArr;
    if (seenTimes.has(key)) continue;
    seenTimes.add(key);
    unique.push(r);
    if (unique.length >= 3) break;
  }
  return unique;
}

function renderResults(results, fromIdx, toIdx, mode = 'normal') {
  const list = $('resultsList');
  list.innerHTML = '';
  const stations = state.data.stations;
  const types = state.data.types;
  const isDown = fromIdx < toIdx;

  if (!results.length) {
    list.innerHTML = '<p class="muted">該当するルートが見つかりませんでした。時刻を変えて再検索してみてください。</p>';
    return;
  }

  const titleMap = { 
    normal: '検索結果', 
    depFirst: '出発 始発', 
    depLast: '出発 終電', 
    arrFirst: '到着 始発', 
    arrLast: '到着 終電' 
  };
  const titleEl = $('results').querySelector('h2');
  if (titleEl) titleEl.textContent = titleMap[mode] || '検索結果';

  results.forEach(r => {
    const card = document.createElement('div');
    card.className = 'result-card' + (r.type === 'transfer' ? ' transfer' : '');

    let html = `<div class="time-big">${formatTimeNoSec(r.totalDep)} <span class="arrow">→</span> ${formatTimeNoSec(r.totalArr)}</div>`;
    const typeLabel = r.type === 'direct' ? '直通' : r.type === 'typeChange' ? '種別変更' : '乗換あり';
    html += `<div class="muted">${typeLabel}　所要 ${calcDuration(r.totalDep, r.totalArr)}</div>`;

    r.legs.forEach((leg, i) => {
      const typeInfo = getTypeInfo(leg.train.type, types);
      const dest = getDestination(leg.train, isDown);
      const fromName = stations[leg.from]?.name || '';
      const toName = stations[leg.to]?.name || '';
      const passNote = leg.train.times.find(s => s.station === leg.from)?.mode === 2 ? '<span class="pass-note">（通過）</span>' : '';
      let changeNote = '';
      if (r.isTypeChange && i === 0 && r.transferStation != null) {
        const nextType = getTypeInfo(r.legs[1].train.type, types);
        changeNote = `<span class="change-note">（${stations[r.transferStation]?.name || ''}から${nextType.name}に変更）</span>`;
      } else if (i === 0 && r.type === 'transfer' && leg.train.times) {
        const stops = leg.train.times.filter(x => x.arr || x.dep).sort((a,b) => a.station - b.station);
        const terminal = isDown ? stops[stops.length - 1]?.station : stops[0]?.station;
        if (terminal != null && terminal !== leg.to) {
          changeNote = `<span class="change-note">（${stations[terminal]?.name || ''}まで乗車可）</span>`;
        }
      } else if (leg.train.nextTrain && leg.train.changeStation != null && !r.isTypeChange) {
        const nextType = getTypeInfo(leg.train.nextTrainType, types);
        changeNote = `<span class="change-note">（${stations[leg.train.changeStation]?.name || ''}から${nextType.name}に変更）</span>`;
      }
      const limitedNote = isLimited(leg.train, types) ? '<span class="pass-note">（特急・有料）</span>' : '';

      html += `<div class="leg">
        <div class="leg-header">
          <span class="type-badge" style="background:${typeInfo.color}">${typeInfo.name}</span>
          ${leg.train.number || ''} ${leg.train.name || ''} ${passNote}${changeNote}${limitedNote}
        </div>
        <div>${fromName} ${formatTimeNoSec(leg.dep)} → ${toName} ${formatTimeNoSec(leg.arr)}</div>
        <div class="muted">行先: ${dest}</div>
      </div>`;
      if (i < r.legs.length - 1 && r.type === 'transfer') {
        const nextLeg = r.legs[i + 1];
        const transferSt = stations[nextLeg.from]?.name || '';
        html += `<div class="muted" style="text-align:center; margin:4px 0;">↓ 乗換（${transferSt}） ↓</div>`;
      } else if (i === 0 && r.type === 'typeChange') {
        const nextType = getTypeInfo(r.legs[1].train.type, types);
        html += `<div class="muted" style="text-align:center; margin:4px 0;">↓ ${stations[r.transferStation]?.name || ''}から${nextType.name}に変更 ↓</div>`;
      }
    });

    card.innerHTML = html;
    card.onclick = () => showRouteDetail(r, isDown);
    list.appendChild(card);
  });
}

function showRouteDetail(route, isDown) {
  const panel = $('detailPanel');
  const stations = state.data.stations;
  const types = state.data.types;
  let html = '';

  route.legs.forEach((leg, idx) => {
    const train = leg.train;
    const typeInfo = getTypeInfo(train.type, types);
    const dest = getDestination(train, isDown);
    html += `<h3 style="margin:12px 0 8px;"><span class="type-badge" style="background:${typeInfo.color}">${typeInfo.name}</span> ${train.number || ''} ${train.name || ''}　行先: ${dest}</h3>`;
    if (route.type === 'transfer' && idx === 0) {
      html += `<p class="muted">乗換駅: ${stations[route.transferStation]?.name || ''}</p>`;
    } else if (route.type === 'typeChange' && idx === 0) {
      const nextType = getTypeInfo(route.legs[1].train.type, types);
      html += `<p class="change-note">${stations[route.transferStation]?.name || ''}から${nextType.name}に変更</p>`;
    }

    const withTime = train.times.filter(t => t.arr || t.dep);
    let minIdx = 0, maxIdx = stations.length - 1;
    if (withTime.length) {
      minIdx = Math.min(...withTime.map(t => t.station));
      maxIdx = Math.max(...withTime.map(t => t.station));
    }

    // 乗換・種別変更の場合、最初の列車は乗換駅/変更駅までで打ち切る
    // 乗換後・種別変更後の列車は乗換駅/変更駅から先のみ表示
    // 最終列車は到着駅で打ち切る
    const isFirstLegOfTransfer = (route.type === 'transfer' || route.type === 'typeChange') && idx === 0;
    const isSecondLegOfTransfer = (route.type === 'transfer' || route.type === 'typeChange') && idx === 1;
    const isLastLeg = idx === route.legs.length - 1;
    if (isFirstLegOfTransfer) {
      if (isDown) {
        maxIdx = Math.min(maxIdx, leg.to);
      } else {
        minIdx = Math.max(minIdx, leg.to);
      }
    }
    if (isSecondLegOfTransfer) {
      if (isDown) {
        minIdx = Math.max(minIdx, leg.from);
      } else {
        maxIdx = Math.min(maxIdx, leg.from);
      }
    }
    if (isLastLeg) {
      if (isDown) {
        maxIdx = Math.min(maxIdx, leg.to);
      } else {
        minIdx = Math.max(minIdx, leg.to);
      }
    }

    html += '<table class="timetable"><thead><tr><th>駅</th><th>着</th><th>発</th></tr></thead><tbody>';

    let indices = [];
    for (let i = minIdx; i <= maxIdx; i++) indices.push(i);
    if (!isDown) indices.reverse();

    indices.forEach(idx => {
      const st = stations[idx];
      const stop = train.times.find(t => t.station === idx);
      let arr = '–', dep = '–';
      let arrClass = '', depClass = '';
      const isOrigin = (isDown ? idx === minIdx : idx === maxIdx);
      if (stop) {
        const isPass = stop.mode === 2;
        const hasArr = stop.arr && stop.arr !== '';
        const sameTime = hasArr && stop.arr === stop.dep;
        arr = (isOrigin || !hasArr || sameTime) ? '–' : formatTimeNoSec(stop.arr);
        dep = formatTimeNoSec(stop.dep);
        if (isPass) {
          if (arr === '–' && dep === '–') {
            arr = '通過'; dep = '通過';
          } else {
            if (arr !== '–') arr += ' (通過)';
            if (dep !== '–') dep += ' (通過)';
          }
          arrClass = depClass = 'pass-time';
        }
      }
      const isRelevant = (idx === leg.from || idx === leg.to);
      html += `<tr ${isRelevant ? 'style="background:#fff3e0"' : ''}><td>${st.name}</td><td class="${arrClass}">${arr}</td><td class="${depClass}">${dep}</td></tr>`;
    });

    // 種別変更後の列車を続ける（乗換の最初の列車では乗換駅以降は表示しない）
    if (train.nextTrain && train.changeStation != null && !isFirstLegOfTransfer) {
      const next = train.nextTrain;
      const nextTypeInfo = getTypeInfo(next.type, types);
      const nextDest = getDestination(next, isDown);
      html += `<tr><td colspan="3" style="background:#f0f7ff; font-weight:600; text-align:center;">↓ ${nextTypeInfo.name} ${next.number || ''} ${nextDest !== '–' ? nextDest + '行き' : ''} に変更 ↓</td></tr>`;

      const nextWithTime = next.times.filter(t => t.arr || t.dep);
      let nMin = 0, nMax = stations.length - 1;
      if (nextWithTime.length) {
        nMin = Math.min(...nextWithTime.map(t => t.station));
        nMax = Math.max(...nextWithTime.map(t => t.station));
      }
      let nIndices = [];
      for (let i = nMin; i <= nMax; i++) nIndices.push(i);
      if (!isDown) nIndices.reverse();

      const changeIdx = train.changeStation;
      nIndices = nIndices.filter(idx => isDown ? idx >= changeIdx : idx <= changeIdx);

      nIndices.forEach(idx => {
        if (idx === changeIdx) return;
        const st = stations[idx];
        const stop = next.times.find(t => t.station === idx);
        let arr = '–', dep = '–';
        let arrClass = '', depClass = '';
        if (stop) {
          const isPass = stop.mode === 2;
          const hasArr = stop.arr && stop.arr !== '';
          const sameTime = hasArr && stop.arr === stop.dep;
          arr = (hasArr && !sameTime) ? formatTimeNoSec(stop.arr) : '–';
          dep = formatTimeNoSec(stop.dep);
          if (isPass) {
            if (arr === '–' && dep === '–') {
              arr = '通過'; dep = '通過';
            } else {
              if (arr !== '–') arr += ' (通過)';
              if (dep !== '–') dep += ' (通過)';
            }
            arrClass = depClass = 'pass-time';
          }
        }
        html += `<tr style="background:#f8f9fa"><td>${st.name}</td><td class="${arrClass}">${arr}</td><td class="${depClass}">${dep}</td></tr>`;
      });
    }

    html += '</tbody></table>';
    if (idx < route.legs.length - 1) {
      html += '<hr style="margin:16px 0; border:none; border-top:1px solid var(--border);">';
    }
  });

  panel.innerHTML = html;
  panel.classList.remove('hidden');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function calcDuration(dep, arr) {
  if (!dep || !arr) return '';
  const toMin = t => {
    const p = t.split(':').map(Number);
    return (p[0] || 0) * 60 + (p[1] || 0);
  };
  let d = toMin(arr) - toMin(dep);
  if (d < 0) d += 24 * 60; // 日付またぎ
  const h = Math.floor(d / 60);
  const m = d % 60;
  return h ? `${h}時間${m}分` : `${m}分`;
}

function doSearch(mode) {
  const fromIdx = parseInt($('fromSelect').value);
  const toIdx = parseInt($('toSelect').value);
  const searchTime = $('searchTime').value || '00:00';
  const searchType = $('searchMode').value;
  const useLimited = $('useLimited').checked;
  if (fromIdx === toIdx) {
    showError('出発駅と到着駅が同じです');
    return;
  }
  hideError();
  $('detailPanel').classList.add('hidden');
  const results = searchRoutes(fromIdx, toIdx, searchTime, useLimited, mode, searchType);
  $('results').classList.remove('hidden');
  renderResults(results, fromIdx, toIdx, mode);
}

// 検索モード切替でラベルを更新
$('searchMode').addEventListener('change', () => {
  const mode = $('searchMode').value;
  if (mode === 'arr') {
    $('timeLabel').textContent = '到着時刻まで';
    $('timeHint').textContent = '指定時刻までに到着するルートを検索';
  } else {
    $('timeLabel').textContent = '出発時刻以降';
    $('timeHint').textContent = '指定時刻以降に出発するルートを検索';
  }
});

// 現在時刻を設定
$('nowBtn').addEventListener('click', () => {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  $('searchTime').value = `${hh}:${mm}`;
});

// 出発駅と到着駅を入れ替え
$('swapBtn').addEventListener('click', () => {
  const from = $('fromSelect');
  const to = $('toSelect');
  const tmp = from.value;
  from.value = to.value;
  to.value = tmp;
});

  const searchType = $('searchMode').value;
  doSearch(searchType === 'arr' ? 'arrFirst' : 'depFirst');
});
$('lastBtn').addEventListener('click', () => {
  const searchType = $('searchMode').value;

      $('main').classList.remove('hidden');
